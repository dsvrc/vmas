hydra:
  searchpath:
    # Resolved through the *imported* benchmarl package.  pact/run.py pins the
    # repo root onto sys.path first, so this and the ConfigStore schemas always
    # come from the same copy of BenchMARL -- which is precisely what breaks
    # when `python benchmarl/run.py` picks up an installed copy instead.
    - pkg://benchmarl/conf

seed: 0
