defaults:
  - vmas_slc_sampling_config
  - _self_

# Stock vmas/sampling under Shared Link Contention.
# reward, done and the base observation are INHERITED untouched; only
# make_world, reset_world_at, process_action, post_step, observation (one
# appended feature) and info are overridden.
max_steps: 100
n_agents: 6
shared_rew: False
n_gaussians: 3
lidar_range: 0.2
cov: 0.05
collisions: True
spawn_same_pos: False

# ---------------------------------------------------------------------------
# Shared Link Contention -- the severity dial.
# TASK physics: this block reaches EVERY arm.  A dial only the method's arm
# experienced is worthless as evidence (NS_FORM_SPEC B.5).
# ---------------------------------------------------------------------------

# The experimental variable.  0 gives g == 1 EXACTLY at every driver value, so
# the sigma=0 environment is recovered byte for byte.  sigma > 1 is a
# beyond-physical stress test and must be labelled as such in every table.
slc_severity: 1.0

# The exogenous emitter.  A global step counter that episode boundaries never
# reset, so the driver cannot be rewound by the agents own failures.
# 2000 steps ~ 20 episodes: near-constant WITHIN an episode, drifting ACROSS.
slc_driver_period: 2000
slc_phase_spread: true       # each vectorised world its own phase: a fleet
                             # operating round the clock, so every batch spans
                             # the cycle and metrics are cycle-averages
slc_a_ref: 0.5               # reference emitter level; the link budget is
                             # anchored here
slc_quiet_scale: 0.5         # on a quiet shift the emitter never exceeds a_ref,
                             # so g clips to exactly 1.0000 for EVERY sigma.
                             # This is the placebo regime (B.4).
slc_p_quiet: 0.0             # 0.0 for the headline sweep, 1.0 for the placebo
                             # certificate

# The link budget.  ANCHOR for sigma = 1 (B.3): a measured busy-hour capacity
# ratio for a 2.4 GHz industrial band -- a 1.54x intra-day swing at 20 dB
# reference SINR.  noise_rise is solved from these two numbers, never tuned.
slc_snr_ref: 100.0
slc_g_min_at_sigma1: 0.65
slc_mean_preserve: false     # D.2: normalise g by its own cycle mean so only
                             # the SHAPE varies.  Deliberately allows g > 1;
                             # off by default, report G4a either way.

# The declared coupling operator.  Computed once at construction from the
# deployment frequency plan and NEVER fitted.
slc_n_chan: 3                # channels; n_agents/n_chan >= 2 keeps every agent
                             # coupled to at least one co-channel peer
slc_aclr: 0.25               # per-hop spectral overlap.  This is the ordinary
                             # partially-overlapping 2.4 GHz picture, not a
                             # clean orthogonal plan -- it is what gives W its
                             # spread across peers
slc_leak_span: 2             # hard zero beyond two channels
slc_duty_lo: 0.7             # heterogeneous robot classes: this is what makes
slc_duty_hi: 1.4             # W ASYMMETRIC
slc_exposure_lo: 0.6         # per-channel emitter exposure: makes the dial
slc_exposure_hi: 1.4         # damage uneven so the binding link really switches
slc_lfix_frac: 0.15          # facility infrastructure traffic -- L^fixed, the
                             # irreducible share
slc_u_nominal: 0.30          # provisioned utilisation; K^0 is derived from it
slc_capacity_mode: scaled    # "scaled": the network was provisioned for the
                             # fleet size, so the N-sweep isolates the
                             # coordination gap.  "fixed": adding robots really
                             # congests the medium.
slc_capacity_ref_agents: 6

# The exertion functional Phi = phi_floor + phi_slope * ||v||.
# Event-triggered communication: a robot that moves faster must report its pose
# more often.  A MAGNITUDE (uncancellable by an anti-symmetric gait) and
# reducible only by not moving, which forfeits reward in every task here.
slc_phi_floor: 0.25          # the heartbeat every robot sends at rest.  PACT
                             # coordination broadcast RIDES IN THIS, so every
                             # arm is charged for it whether or not it listens.
slc_phi_slope: 1.875         # phi_floor + phi_slope * v_ref == 1.0
slc_v_ref: 0.4               # VMAS holonomic terminal speed at u_range=1,
                             # mass=1, dt=0.1, drag=0.25
slc_phi_reads_executed: true # A.6: true = LOOP-COUPLED, compensating feeds the
                             # medium it compensates against, so T4 applies and
                             # an interior optimum in max_trust is PREDICTED.
                             # false = the no-loop contrast arm.

# The harm channel: a congested link means fewer setpoint updates, and a
# sampled-data loop achievable gain scales with its update rate.
# f_exec = (1 - c) * f_cmd,  c = harm_gain * u.  Continuous and invertible.
slc_harm_at_nominal: 0.30    # ANCHOR, not a tuned knob: a control loop only
                             # gets its setpoints through in the airtime the
                             # channel is idle, so delivered loop gain is the
                             # idle fraction 1-u.  Equal to u_nominal, this
                             # makes harm_gain exactly 1.0 -- that statement
                             # and nothing more.
slc_harm_cap: 0.85           # a robot never loses all authority
slc_harm_enabled: true       # false recovers stock VMAS byte for byte (B0)
slc_discrete_nvec: 3         # levels per action component, DISCRETE ARMS ONLY
                             # (qmix/vdn/iql).  NOT part of the NS.  VMAS's
                             # default 3 puts every non-zero command on the
                             # action box, leaving the channel inverse nothing
                             # to work with -- use 7 or 9 for a discrete PACT
                             # arm, and report slc/sat_frac either way.
slc_observe_loading: true    # A.4: the agent observes its OWN loading, one step
                             # stale.  That gap is the problem; a sensor that
                             # closed it would be an oracle.

# ---------------------------------------------------------------------------
# PACT -- the compensator.  Read by the method layer only; the dial never sees
# these keys.
# ---------------------------------------------------------------------------
pact_enabled: false          # the arm switch
pact_mode: delta             # delta | level | ff
                             #   delta : every term corrects the MEASURED stale
                             #           loading, so the pedestal is removed by
                             #           construction
                             #   level : 6.4 as written (explicit slow EMA)
                             #   ff    : feedforward only -- the
                             #           INFORMATION-MATCHED BASELINE
pact_gate: fit               # fit | trace | always.  "trace" reproduces the
                             # silent-disarm failure and is an ablation only.
pact_r: 1                    # peer channels.  r=2 measured WORSE conditioned
                             # than one weighted channel (3006 vs 810)
pact_mu: 0.99                # RLS forgetting.  RE-MEASURE per environment --
                             # the optimum follows the drift rate
pact_p0: 10.0
pact_p_max_mult: 10.0        # covariance windup bound; without it the estimator
                             # runs away once excitation dies
pact_max_trust: 0.80         # THE T4 gain cap.  A Phase-1 calibration
                             # parameter: swept, reported with its sweep,
                             # calibrated on one seed and validated on held-out
                             # seeds
pact_ff_gain: 1.0            # the analytic driver feedforward.  LOCAL -- it
                             # supports no coordination claim.  ff_gain=0 is the
                             # peer-only ablation
pact_own_gain: 1.0
pact_fit_floor: 0.0          # gate on MEASURED lift over the null, not a proxy
pact_ready_updates: 200
pact_fit_ema: 0.002          # windowed, not cumulative
pact_warmup_updates: 50
pact_level_tau: 400.0
pact_max_delta: 1.0
pact_denom_floor: 0.15       # a rail-pinned delta is a CONSTANT BIAS, not a
                             # compensation
pact_u_cap: 3.0
