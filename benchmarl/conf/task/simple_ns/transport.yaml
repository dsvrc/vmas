defaults:
  - simple_ns_transport_config
  - _self_

# ---------------------------------------------------------------------------
# Stock vmas/transport, unchanged.  THE HEADLINE HOST.
#
# Chosen on the calibration ladder (simple_ns/calibrate.py) before any training:
# it is the one host whose return falls far and monotonically under the dial and
# whose free-answer ceiling stays high enough to be worth chasing.
# ---------------------------------------------------------------------------
max_steps: 100
n_agents: 4
n_packages: 1
package_width: 0.15
package_length: 0.15
package_mass: 50

# ---------------------------------------------------------------------------
# The exertion dial.  TASK physics: this block reaches EVERY arm (NS-3.1).
#
# Cell (C, invertible): the disturbance is an additive force in the agent's own
# action space, reaching it ONLY through its neighbours.  A lone agent feels
# nothing at any severity; a correct estimate cancels it exactly.
# ---------------------------------------------------------------------------
ns_severity: 2.0             # sigma. 0 makes the disturbance EXACTLY zero at
                             # every driver value, so the stock scenario is
                             # recovered bit for bit and this is how B0 is run.
                             #
                             # 2.0 is the COMMITTED operating point, chosen on
                             # simple_ns/calibrate.py BEFORE any training, on
                             # transport's own shipped heuristic policy
                             # (3 seeds, 32 envs, 250 steps; the table is in
                             # runs/simple_ns_calibration.csv):
                             #
                             #   sigma   blind    PACT   oracle(ceiling)  clip
                             #     0     100.0%  100.0%   100.0%           0%
                             #     1      87.8%  103.8%   108.1%          10%
                             #   1.5      64.5%   90.0%   109.7%          15%
                             #     2      50.3%   78.9%   111.7%          17%
                             #     3      37.1%   62.7%   110.3%          22%
                             #
                             # At 2.0 the blind arm loses half its return while
                             # the free-answer ceiling is still full recovery, so
                             # the row measures the METHOD and not the
                             # environment. 1.0 is the mild row, 3.0 the stress
                             # row; none of these is past sigma*.
ns_channel: shove            # FORCE FIGHT / WAKE -- the medium transmits the
                             # neighbours' exertion as a force in this agent's own
                             # action space: partners fighting through the rigid
                             # payload, or a rotorcraft flying through its
                             # neighbours' downwash. Additive, and invertible by
                             # subtraction.
                             #
                             # balance uses `droop` instead -- see its yaml. The
                             # two are different cells of II.6 and the comparison
                             # between them is informative; neither is a fallback
                             # for the other.
ns_droop_max: 0.9           # unused by the shove channel; kept so the four
                             # task configs stay comparable key for key.
ns_period: 100               # steps per driver cycle
ns_wet_fraction: 0.5         # the remaining half is EXACTLY quiet -- that is
                             # what makes NS-2.5's placebo provable rather than
                             # merely small
ns_loss_at_sigma1: 0.14      # STATED CALIBRATION TARGET, not a published
                             # constant: at the driver peak, with every peer at
                             # full exertion, the disturbance is 0.14 of the
                             # receiver's own action range. Normalised against
                             # the host's OWN spawn geometry, so sigma means the
                             # same physical severity in every host. road_ns's
                             # sigma=1 IS anchored (HCM, 14% capacity); this one
                             # is not, and the paper must say so.
ns_rho: 0.9                  # transmission memory. Applied to the PUBLIC
                             # channels, so the model stays exactly linear in
                             # what the agent can compute.
ns_n_types: 3                # r. Independent of the number of agents (P-1.1):
                             # adding agents adds no parameters.
ns_recv_spread: 0.6          # receiver compliance spread -- PUBLIC, and what
                             # makes the operator asymmetric
ns_send_spread: 0.8          # sender gain spread -- this is beta*, and it is
                             # NOT handed to the agent
ns_kernel_lambda: 0.35       # transmission length scale, world units
ns_y_clip: 10.0              # P-2.1's declared bound on the sensor
ns_observe_residual: true    # II.2: the agent observes its OWN residual, ONE
                             # STEP STALE. Proprioception, not privilege.
ns_direct: false             # THE (B) CONTROL. true moves this instance from
                             # cell (C) to cell (B): same driver, same severity,
                             # same reward, but the disturbance no longer passes
                             # through the neighbours and a LONE agent feels it.
                             # Run it against the default to show that what the
                             # peer channels buy is the whole multi-agent part.

# ---------------------------------------------------------------------------
# PACT-1. Read by the method layer only; the dial never sees these keys.
# ---------------------------------------------------------------------------
pact_enabled: false          # the arm switch
pact_trust: 0.9              # P-5.1's INVERTED prior: near full reliance, not
                             # half
pact_mu: 0.95                # the tracking dial (P-4.3): declared, SWEPT, and
                             # not inherited.  URB's 0.999 has an effective
                             # memory of 1/(1-mu) = 1000 steps, but this driver
                             # cycles every 100, so at 0.999 the estimator
                             # averages the drift away instead of tracking it.
                             #
                             # Swept on transport at sigma=2, 3 seeds, WITH the
                             # covariance windup bound (pact_p_trace_max).
                             # Blind is 50.3% of B0:
                             #
                             #   mu     memory   %B0    pred err   diverged
                             #   0.999    1000   73.2%    0.631        0
                             #   0.99      100   77.9%    0.622        0
                             #   0.97       33   79.9%    0.578        0
                             #   0.95       20   82.1%    0.544        0   <- here
                             #   0.90       10   80.0%    0.525        0
                             #
                             # 0.95 is best on BOTH return and prediction error.
                             # Before the windup bound existed, every mu <= 0.95
                             # diverged and a real 3M-frame run logged 5.7M
                             # non-finite predictions out of 12M agent-steps --
                             # which is why 0.97 was the previous default.  The
                             # bound removed the stability constraint, so mu is
                             # now only the bias/variance choice P-4.3 says it is.
                             #
                             # Watch pact/n_bounded: a rising count means mu is
                             # aggressive for the excitation this policy gives.
pact_p0: 10.0
pact_warmup: 200             # steps before any reliance is applied
pact_channels: full          # "intercept" deletes ONLY the peer channels and
                             # keeps everything else, leaving a per-agent
                             # adaptive bias. On (B) it should lose nothing; on
                             # (C) it should lose most of the recovery. That
                             # pair is what the classification rests on.
pact_p_trace_max: 100.0      # bound on covariance windup, as a multiple of the
                             # initial trace p0*dim.  Declared, not tuned.
                             #
                             # RLS with forgetting divides P by mu every step, so
                             # a direction the policy stops exciting grows
                             # without bound until the prediction overflows.
                             # P-4.2's dead-row skip cannot catch it: it only
                             # sees an EXACTLY zero regressor, and a poorly
                             # excited one is not zero.
                             #
                             # Measured on a real 3M-frame run before this
                             # existed: 5.7M non-finite predictions out of ~12M
                             # agent-steps, fit_gain NaN from iteration 4, and an
                             # applied correction worth 4% of the disturbance.
                             # PACT was not beaten by the baseline -- it never ran.
                             # Set 0 to disable and reproduce that.
pact_corr_clip: 0.5          # guard rail, declared: |correction| <= 0.5 of the
                             # agent's own action range.  NOT a tuning knob.
                             # Without it a DIVERGED estimator (prediction error
                             # 1e34 at mu=0.9) was clamped by the action box into
                             # a large saturating kick that SCORED BETTER than a
                             # correct estimate -- 96.2% of B0 against 84.7%.
                             # Selecting mu on return would then have selected
                             # the diverged estimator.  mu is selected on
                             # PREDICTION ERROR; this bound is what makes that
                             # safe.  Symmetric about 0, so P-7.1 stays exact.
pact_oracle: false           # true replaces the estimate with the TRUE
                             # disturbance: the free-answer controller, i.e. the
                             # CEILING. Where it fails, sigma is past sigma* and
                             # the row is about the environment, not the method.

# ---------------------------------------------------------------------------
# BASELINES.md additions.  All OFF by default: with these values the task is
# bit-identical to the one the PACT rows were run on.  See baselines/README.md.
# ---------------------------------------------------------------------------

ns_observe_driver: false     # D.4 / B6 / B8.  true appends the driver A(t) to
                             # every agent's observation.  A(t) is a function of
                             # observable time that no agent influences, so this
                             # is a grant of PUBLIC information -- not sigma, not
                             # beta*, not the peers' draw.  Required by
                             # algorithm=lcpo and algorithm=rma, and it is the
                             # "oracle-driver blind" arm when used with a stock
                             # learner.

ns_observe_prev_action: false
                             # B8.  true appends the agent's OWN executed action
                             # from the previous step (divided by its action
                             # range) to its observation.  RMA and UP-OSI both
                             # identify the environment from a window of
                             # (state, action) pairs, so a history encoder needs
                             # the action stream.  Proprioception, not privilege:
                             # the jack already measures the force it delivered,
                             # which is what the residual column reports.
                             # Required by algorithm=rma.

ns_dr_enabled: false         # B9's must-run robust baseline: domain
                             # randomisation over sigma.  true redraws
                             # sigma ~ U[ns_dr_low, ns_dr_high] PER EPISODE per
                             # parallel world and IGNORES ns_severity for the
                             # magnitude.  Train with it on; evaluate at the
                             # committed sigma in a separate run -- see
                             # baselines/docs/dr_sigma.md.
ns_dr_low: 0.0
ns_dr_high: 3.0              # BASELINES.md B9: "resample sigma in [0, 3]".

ns_baseline: none            # B10's non-learning compensators, as ARMS:
                             #   none     -- no compensator (blind, or PACT if
                             #               pact_enabled)
                             #   eso      -- per-agent extended-state observer
                             #               (linear ADRC).  No peer
                             #               information, no basis, one gain.
                             #   rls_raw  -- PACT's own RLS on the raw N-1 peer
                             #               draws instead of the r declared
                             #               classes.
                             # Both share PACT's trust, warm-up and correction
                             # bound, so a difference is a difference in the
                             # ESTIMATOR. Setting this together with
                             # pact_enabled is an error, not a double
                             # feed-forward.

eso_bandwidth: 0.3           # the ESO's single tuning constant: both observer
                             # poles at 1 - w on the unit disc, giving
                             # beta1 = 2w, beta2 = w^2 (the sampled-data ESO of
                             # Miklosovic, Radke & Gao, ACC 2006, at T=1).  w -> 1 copies the last
                             # measurement, w -> 0 never moves.

rls_raw_use_operator: false  # false is BASELINES.md's literal wording --
                             # "regress the residual on the N-1 broadcast
                             # actions directly".  true additionally weights
                             # peer j by the declared W_ij, which is public, and
                             # leaves the class reduction as the only
                             # difference from PACT.  Report both; the claim
                             # should not rest on withholding public
                             # information.

# ---------------------------------------------------------------------------
# EXTRA baselines.  All OFF / inert by default: with these values the task is
# bit-identical to the one every existing arm was run on.
# See baselines/README_EXTRA.md.
# ---------------------------------------------------------------------------

ns_observe_prev_reward: false
                             # X4 (WISDOM) / X6 (M3W).  true appends the reward
                             # of the transition that produced this observation.
                             # Both methods are defined on a window of
                             # TRANSITIONS -- WISDOM's context encoder reads
                             # (o, a, r, o'), M3W's critic target needs an
                             # n-step return -- and a window of observations is
                             # only a window of transitions if the reward is in
                             # it.  vmas computes rewards before observations
                             # inside one step, so the column is causal, and it
                             # is the agent's OWN reward, which it has always
                             # been told.  RAW: both methods normalise it
                             # themselves, as their reference code does.

ns_observe_time: false       # X2 (DEDA-FP).  true appends t/horizon in [0, 1],
                             # t being the step index WITHIN the episode.  A
                             # mean-field game is a finite-horizon object: its
                             # equilibrium policy and its population
                             # distribution are both functions of t, and
                             # DEDA-FP's average policy and conditional
                             # normalising flow are both conditioned on it.
ns_time_horizon: 0           # the denominator; 0 means "use ns_period", which
                             # equals max_steps on every simple_ns host.

ns_dr_dist: uniform          # X5 (DORAEMON).  "uniform" is B9's fixed
                             # U[ns_dr_low, ns_dr_high].  "beta" draws
                             # Beta(a, b) rescaled onto the same support and
                             # lets algorithm=doraemon REPLACE (a, b) between
                             # training rounds -- which is the whole method.
                             # Requires ns_dr_enabled=true.
ns_dr_a: 100.0               # DORAEMON's `init_beta_param`: a = b = 100 is a
ns_dr_b: 100.0               # distribution tightly concentrated on the middle
                             # of the support.  Entropy maximisation starts
                             # there and grows outward, which is the point --
                             # starting from the uniform would leave nothing to
                             # maximise.
