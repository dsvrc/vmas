defaults:
  - lcpo_config
  - _self_

# ---------------------------------------------------------------------------
# LCPO (BASELINES.md B6) -- online RL in non-stationary CONTEXT-DRIVEN
# environments.  Hamadanian et al., ICLR 2025; code pouyahmdn/LCPO.
#
# REQUIRES `task.ns_observe_driver=true`.  LCPO is defined for an OBSERVED
# context; without the driver in the observation there is nothing to be
# out-of-distribution with respect to, and the algorithm raises.
#
# ALSO SET, in the launcher (scripts/run_baselines.sh does it):
#     experiment.on_policy_minibatch_size = on_policy_collected_frames_per_batch
#     experiment.on_policy_n_minibatch_iters = 1
# LCPO takes ONE policy step and ONE value step per rollout, on the whole
# rollout.  Leaving BenchMARL's 45 x 15 optimiser calls in place would train the
# critic 675 times per rollout against LCPO's once, and the trust-region step
# would still fire only once -- so the arm would be "LCPO's actor with a wildly
# over-trained critic". See baselines/docs/lcpo.md.
# ---------------------------------------------------------------------------

# --- inherited IPPO plumbing (the critic, the GAE, the policy head) --------
share_param_critic: True
clip_epsilon: 0.2             # unused: LCPO's surrogate is unclipped, the trust
                              # region does the constraining. Kept because the
                              # loss subclasses torchrl's ClipPPOLoss for its
                              # critic and GAE machinery.
entropy_coef: 0.0             # unused: LCPO carries its own annealed entropy
                              # factor, below.
critic_coef: 1.0
loss_critic_type: "l2"        # LCPO: torch.nn.MSELoss
lmbda: 0.95                   # LCPO's gae_advantage lambda
scale_mapping: "biased_softplus_1.0"
use_tanh_normal: True
minibatch_advantage: False

# --- where the context lives in the observation ----------------------------
context_start: -1             # negative counts from the end. With
                              # ns_observe_driver=true the driver A(t) is the
                              # LAST observation component, so -1 is right for
                              # every simple_ns host.
context_size: 1               # A(t) is a scalar.

# --- the two trust regions -------------------------------------------------
kl_in: 0.1                    # LCPO --trpo_kl_in default 1e-1
kl_out: 0.001                 # LCPO --trpo_kl_out default 1e-3
damping: 0.1                  # LCPO --trpo_damping default 1e-1
solve_dual: True              # LCPO --trpo_dual. True solves the two-constraint
                              # dual, which is the version the paper reports;
                              # False steps along the out-of-distribution
                              # direction alone.
cg_iters: 15                  # `conjugate_gradients(..., 15)` in core_lcpo
max_backtracks: 10            # `linesearch(..., max_backtracks=10)`
accept_ratio: 0.1             # `linesearch(..., accept_ratio=.1)`

# --- entropy schedule (LCPO's tune_entropy, decay branch) -------------------
entropy_max: 0.1              # --entropy_max default 0.1
entropy_min: 0.0              # --entropy_min default 0
entropy_decay: 0.00002        # --entropy_decay default 2e-5, subtracted once
                              # per rollout.
                              # NOT IMPLEMENTED: --auto_target_entropy, LCPO's
                              # alternative automatic tuning. See
                              # baselines/docs/lcpo.md.

# --- the out-of-distribution reservoir -------------------------------------
ood_window: 6000              # `ood_mini_len = master_batch`: the recent
                              # window is one rollout. Set it to
                              # on_policy_collected_frames_per_batch.
ood_capacity: 50000           # `ood_len = master_batch * num_epochs`, i.e. LCPO
                              # keeps everything.  Bounded here so the reservoir
                              # is a fixed 50k joint states
                              # (~16 MB at 4 agents and a 20-wide observation)
                              # instead of growing to the frame budget.
ood_subsample: 10             # LCPO's --ood_subsample: insert one state in n
                              # into the reservoir.
ood_threshold: 0.05           # LCPO's --lcpo_thresh with --lcpo_ood_type l2:
                              # a stored state is out of distribution when the
                              # SQUARED distance between its context and the
                              # mean context of the recent window exceeds this.
                              #
                              # NOT the paper's 1.0, and it cannot be: that
                              # value is on windy-gym's context scale. A(t)
                              # lives in [0, 1] here, so the squared distance
                              # between two window means cannot reach 1.0 and
                              # the test would NEVER fire -- measured: at 1.0
                              # every iteration took the A2C fallback branch,
                              # i.e. LCPO never ran. 0.05 is a mean-context gap
                              # of ~0.22, about the span between the quiet half
                              # of the cycle (A=0) and the wet average.
                              #
                              # It is a swept hyper-parameter in the paper
                              # (0.25/0.5/1/2/4 of its own scale), so sweep it
                              # here too -- and WATCH lcpo_branch: 0 means the
                              # trust region never engaged and the row is A2C.

# --- compute bounds --------------------------------------------------------
trpo_batch: 1024              # Cap on the joint states used per trust-region
                              # step. 0 uses the whole rollout, which is LCPO's
                              # behaviour -- but its rollout is 512-8192
                              # transitions and ours is 6000 joint states, each
                              # of which costs two Fisher-vector products per
                              # conjugate-gradient iteration.
grad_clip: 0.5                # `clip_grad_norm_(policy_net.parameters(), 0.5)`
                              # on the A2C fallback branch.
