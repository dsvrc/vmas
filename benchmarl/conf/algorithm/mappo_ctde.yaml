defaults:
  - mappo_ctde_config
  - _self_


# Hand the centralised critic the true exogenous driver [A(t), c(t)].
# Training-only and critic-only: the actor's input spec never contains it, so
# execution stays fully decentralised.  Set False to get plain MAPPO, which is
# the ablation that isolates what the payload is worth.
critic_payload: True

share_param_critic: True
clip_epsilon: 0.2
entropy_coef: 0.0
critic_coef: 1.0
loss_critic_type: "l2"
lmbda: 0.9
scale_mapping: "biased_softplus_1.0"
use_tanh_normal: True
minibatch_advantage: False
